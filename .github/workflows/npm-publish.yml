name: Publish to npm

# Runs when the Socket flows create a release (tag = the version, e.g. "1.0.720").
# Publishes with npm trusted publishing (OIDC): no npm token is stored here.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub hand npm a short-lived identity for this run
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use an npm that supports trusted publishing (11.5.1 or later)
        run: npm install -g npm@latest
      - name: Stamp the release's version on the package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VER="${TAG_NAME#v}"
          npm version "$VER" --no-git-tag-version
          node scripts/write-files.js "$VER"
      - name: Publish to npm
        run: npm publish
